- id: '1768140752108'
  alias: Keuken bewegingsmelder verlichting
  description: Licht aan bij beweging als het donker is (gang lux < 15). Helderheid
    en kleur op basis van tijdstip.
  triggers:
  - entity_id: binary_sensor.keuken_bewegingsmelder
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.keuken_bewegingsmelder
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.gang_bewegingsmelder_licht
      below: 15
    then:
    - choose:
      - conditions:
        - condition: time
          after: 05:00:00
          before: 09:00:00
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.keuken_strip_boven
            - light.keuken_strip_onder
          data:
            brightness_pct: 30
            effect: sunbeam
        - action: light.turn_on
          target:
            entity_id:
            - light.keuken_spots
            - light.keuken_lamp_voor
            - light.keuken_lamp_midden
            - light.keuken_lamp_achter
          data:
            brightness_pct: 30
            color_temp_kelvin: 2200
      - conditions:
        - condition: time
          after: '17:00:00'
          before: '22:00:00'
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.keuken_strip_boven
            - light.keuken_strip_onder
          data:
            brightness_pct: 80
            effect: sunset
        - action: light.turn_on
          target:
            entity_id:
            - light.keuken_spots
            - light.keuken_lamp_voor
            - light.keuken_lamp_midden
            - light.keuken_lamp_achter
          data:
            brightness_pct: 80
            color_temp_kelvin: 2200
      default:
      - action: light.turn_on
        target:
          entity_id:
          - light.keuken_strip_boven
          - light.keuken_strip_onder
        data:
          brightness_pct: 15
          color_temp_kelvin: 1800
      - action: light.turn_on
        target:
          entity_id:
          - light.keuken_spots
          - light.keuken_lamp_voor
          - light.keuken_lamp_midden
          - light.keuken_lamp_achter
        data:
          brightness_pct: 15
          color_temp_kelvin: 2200
    else:
    - action: light.turn_off
      target:
        area_id: keuken
  mode: restart
- id: '1768161870850'
  alias: CO2 waarschuwing
  description: Triggert wanneer een CO2 sensor met label 'CO2' boven de 1000 of 1200
    komt. Via de legacy dienst notify.mobile_app_fairphone_6_gj, omdat notify.send_message
    geen data doorgeeft; group bundelt de meldingen op Android, tag vervangt per sensor.
  triggers:
  - trigger: template
    value_template: '{{ label_entities(''CO2'') | map(''states'') | map(''float'',
      0) | select(''gt'', 1000) | list | count > 0 }}'
  actions:
  - repeat:
      for_each: '{{ label_entities(''CO2'') }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(repeat.item) | float(0) > 1200 }}'
        then:
        - action: notify.mobile_app_fairphone_6_gj
          data:
            title: '⚠️ CO2 Alarm: Zeer Hoog'
            message: De CO2 in {{ area_name(repeat.item) }} is {{ states(repeat.item)
              }} ppm!
            data:
              group: co2
              tag: co2_{{ repeat.item }}
              channel: CO2
        else:
        - if:
          - condition: template
            value_template: '{{ states(repeat.item) | float(0) > 1000 }}'
          then:
          - action: notify.mobile_app_fairphone_6_gj
            data:
              title: CO2 Melding
              message: De luchtkwaliteit in {{ area_name(repeat.item) }} verslechtert
                ({{ states(repeat.item) }} ppm).
              data:
                group: co2
                tag: co2_{{ repeat.item }}
                channel: CO2
  mode: parallel
- id: '1768165004229'
  alias: Apparaattemperatuur waarschuwing
  description: Triggert wanneer een entiteit met label 'Apparaattemperatuur' onder
    de 10 of boven de 90 komt.
  triggers:
  - trigger: template
    value_template: '{{ label_entities(''Apparaattemperatuur'') | map(''states'')
      | map(''float'', 10) | select(''gt'', 90) | list | count > 0 }}'
  - trigger: template
    value_template: '{{ label_entities(''Apparaattemperatuur'') | map(''states'')
      | map(''float'', 10) | select(''lt'', 10) | list | count > 0 }}'
  actions:
  - repeat:
      for_each: '{{ label_entities(''Apparaattemperatuur'') }}'
      sequence:
      - if:
        - condition: template
          value_template: '{% set val = states(repeat.item) | float(20) %}

            {{ (val > 90 or val < 10) and val != 0 }}

            '
        then:
        - action: notify.mobile_app_fairphone_6_gj
          data:
            title: ⚠️ Apparaattemperatuur
            message: '{{ state_attr(repeat.item, ''friendly_name'') }} is nu {{ states(repeat.item)
              }}°C!'
            data:
              group: apparaattemperatuur
              tag: apparaattemperatuur_{{ repeat.item }}
  mode: parallel
- id: '1768166469947'
  alias: Probleem waarschuwing
  description: Waarschuwt wanneer een entiteit met label 'Probleem' aan gaat.
  triggers:

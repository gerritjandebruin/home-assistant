- id: '1736081312239'
  alias: Spanning waarschuwing
  description: Geeft een melding wanneer de spanning van een apparaat buiten het normale
    bereik valt (hoger dan 253V of tussen 1V en 207V), met uitzondering van Growatt
    sensoren.
  triggers:
  - trigger: template
    value_template: '{{ label_entities(''Spanning'') | map(''states'') | map(''float'',
      230) | select(''gt'', 253) | list | count > 0 }}'
  - trigger: template
    value_template: '{{ label_entities(''Spanning'') | map(''states'') | map(''float'',
      230) | select(''lt'', 207) | list | count > 0 }}'
  conditions: []
  actions:
  - repeat:
      for_each: '{{ label_entities(''Spanning'') }}'
      sequence:
      - if:
        - condition: template
          value_template: '{% set val = states(repeat.item) | float(230) %} {{ (val
            > 253 or val < 207) and val != 0 }}

            '
        then:
        - action: notify.mobile_app_fairphone_6_gj
          data:
            title: ⚠️ Spanning
            message: '{{ state_attr(repeat.item, ''friendly_name'') }} is nu {{ states(repeat.item)
              }} V!'
            data:
              group: spanning
              tag: spanning_{{ repeat.item }}
  mode: single
- id: '1750005386050'
  alias: Overloop verlichting
  description: Overlooplamp aan bij beweging in gang of overloop, alleen als het donker
    is. Helderheid en kleur op basis van tijdstip. Uit na 5 minuten geen beweging.
    Gaat niet aan zolang de dakterrasdeur openstaat.
  triggers:
  - type: occupied
    device_id: e13fa775ae5c1aa7dc0dd04f3d6fe2e8
    entity_id: 48f91ab28a35ff8c56779561f10c1d33
    domain: binary_sensor
    trigger: device
  - type: motion
    device_id: f0557193b49cd30a72b37ed875ced7b6
    entity_id: ee892634746b2f5638cbfadb0a0aca3c
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: state
    entity_id: binary_sensor.gang_bewegingsmelder_licht
    state:
    - 'off'
  - condition: state
    entity_id: binary_sensor.dakterras_deur_deur
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 05:00:00
        before: 09:00:00
      sequence:
      - action: light.turn_on
        target:
          area_id: overloop
        data:
          brightness_pct: 30
          color_temp_kelvin: 2200
    - conditions:
      - condition: time
        after: 09:00:00
        before: '17:00:00'
      sequence:
      - action: light.turn_on
        target:
          area_id: overloop
        data:
          brightness_pct: 51
          color_temp_kelvin: 3390
    - conditions:
      - condition: time
        after: '17:00:00'
        before: '22:00:00'
      sequence:
      - action: light.turn_on
        target:
          area_id: overloop
        data:
          brightness_pct: 80
          color_temp_kelvin: 2200
    default:
    - action: light.turn_on
      target:
        area_id: overloop
      data:
        brightness_pct: 1
        color_temp_kelvin: 2000
  - wait_template: '{{ (states(''binary_sensor.gang_bewegingsmelder_beweging'') ==
      ''off'') and (states(''binary_sensor.overloop_bewegingsmelder'') == ''off'')
      }}'
    continue_on_timeout: true
    timeout: 00:05:00
  - action: light.turn_off
    target:
      area_id: overloop
  mode: single
  max_exceeded: silent

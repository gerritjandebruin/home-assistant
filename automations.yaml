- id: '1784746513211'
  alias: Batterij waarschuwing
  description: 'Dagelijkse check om 10:00: melding als een batterijsensor onder de
    5% zit of unavailable is (Aqara/Tuya vallen vaak van de klif zonder laag percentage
    te melden). Telefoons uitgezonderd.'
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: template
    value_template: '{{ (laag | count) + (dood | count) > 0 }}'
  actions:
  - action: notify.mobile_app_fairphone_6_gj
    data:
      title: "\U0001FABB Batterij waarschuwing"
      message: '{% if laag %}Bijna leeg: {{ laag | join('', '') }}.{% endif %}{% if
        laag and dood %} {% endif %}{% if dood %}Offline (batterij leeg?): {{ dood
        | join('', '') }}.{% endif %}'
      data:
        group: batterij
  variables:
    uitzonderingen:
    - sensor.fairphone_6_battery_level
    - sensor.telefoon_mirjam_battery_level
    laag: '{% set ns = namespace(l=[]) %}{% for s in states.sensor if s.attributes.get(''device_class'')
      == ''battery'' and s.attributes.get(''unit_of_measurement'') == ''%'' and s.entity_id
      not in uitzonderingen and s.state | is_number and s.state | float < 5 %}{% set
      naam = (area_name(s.entity_id) or ''?'') ~ '' '' ~ (s.name | replace('' Batterij'','''')
      | replace('' batterij'','''')) %}{% set ns.l = ns.l + [naam ~ '' ('' ~ s.state
      ~ ''%)''] %}{% endfor %}{{ ns.l }}'
    dood: '{% set ns = namespace(l=[]) %}{% for s in states.sensor if s.attributes.get(''device_class'')
      == ''battery'' and s.attributes.get(''unit_of_measurement'') == ''%'' and s.entity_id
      not in uitzonderingen and s.state in [''unavailable'', ''unknown''] %}{% set
      naam = (area_name(s.entity_id) or ''?'') ~ '' '' ~ (s.name | replace('' Batterij'','''')
      | replace('' batterij'','''')) %}{% set ns.l = ns.l + [naam] %}{% endfor %}{{
      ns.l }}'
  mode: single
- id: '1784753169683'
  alias: Badkamer verlichting - uit zonder beweging
  description: 'Vangnet: verlichting aan (bv. via deursensor) maar de bewegingsmelder
    heeft niets gezien -> na 15 min uit. Toegevoegd 2026-07-22.'
  triggers:

- id: '1699803193333'
  alias: Slaapkamer verlichting afstandsbediening
  description: 'Midden kort: strip aan op 30% en 2700 K en spots uit; als strip al
    aan is, alles uit. Omlaag kort: wisselt spots+strip → alleen strip → alleen spots.
    Omlaag lang: nachtstand (spots uit, strip op 20%). Omhoog kort +20%; vasthouden
    dimt omhoog. Links/rechts: warmer/kouder; lang = uiterste.'
  triggers:
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_short_press
    subtype: turn_on
    id: midden
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_short_press
    subtype: dim_up
    id: omhoog
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_press
    subtype: dim_up
    id: omhoog_lang
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_release
    subtype: dim_up
    id: los
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_short_press
    subtype: dim_down
    id: omlaag
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_press
    subtype: dim_down
    id: omlaag_lang
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_release
    subtype: dim_down
    id: los
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_short_press
    subtype: left
    id: links
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_press
    subtype: left
    id: links_lang
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_short_press
    subtype: right
    id: rechts
  - trigger: device
    domain: zha
    device_id: 5a9933c449a2a8068f6012de36a6e91d
    type: remote_button_long_press
    subtype: right
    id: rechts_lang
  conditions: []
  actions:
  - variables:
      alle:
      - light.slaapkamer_lamp_1
      - light.slaapkamer_lamp_2
      - light.slaapkamer_lamp_3
      - light.slaapkamer_lamp_4
      - light.slaapkamer_lamp_5
      - light.slaapkamer_strip
      aan: '{{ alle | select(''is_state'',''on'') | list }}'
      spots:
      - light.slaapkamer_lamp_1
      - light.slaapkamer_lamp_2
      - light.slaapkamer_lamp_3
      - light.slaapkamer_lamp_4
      - light.slaapkamer_lamp_5
      spots_aan: '{{ spots | select(''is_state'',''on'') | list | count > 0 }}'
      strip_aan: '{{ is_state(''light.slaapkamer_strip'',''on'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id:
        - midden
      sequence:
        choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''light.slaapkamer_strip'',''on'') }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.slaapkamer_lamp_1
              - light.slaapkamer_lamp_2
              - light.slaapkamer_lamp_3
              - light.slaapkamer_lamp_4
              - light.slaapkamer_lamp_5
              - light.slaapkamer_strip
        - conditions:
          - condition: template
            value_template: '{{ not is_state(''light.slaapkamer_strip'',''on'') }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.slaapkamer_lamp_1
              - light.slaapkamer_lamp_2
              - light.slaapkamer_lamp_3
              - light.slaapkamer_lamp_4
              - light.slaapkamer_lamp_5
          - action: light.turn_on
            target:
              entity_id: light.slaapkamer_strip
            data:
              brightness_pct: 30
              color_temp_kelvin: 2700
    - conditions:
      - condition: trigger
        id:
        - omhoog
      sequence:
      - if:
        - condition: template
          value_template: '{{ aan | count == 0 }}'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.slaapkamer_lamp_1
            - light.slaapkamer_lamp_2
            - light.slaapkamer_lamp_3
            - light.slaapkamer_lamp_4
            - light.slaapkamer_lamp_5
          data:
            brightness_pct: 20
        else:
        - action: light.turn_on
          target:
            entity_id: '{{ aan }}'
          data:
            brightness_step_pct: 20
    - conditions:
      - condition: trigger
        id:
        - omlaag
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ spots_aan and strip_aan }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.slaapkamer_lamp_1
              - light.slaapkamer_lamp_2
              - light.slaapkamer_lamp_3
              - light.slaapkamer_lamp_4
              - light.slaapkamer_lamp_5
        - conditions:
          - condition: template
            value_template: '{{ strip_aan }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.slaapkamer_strip
          - action: light.turn_on
            target:
              entity_id:
              - light.slaapkamer_lamp_1
              - light.slaapkamer_lamp_2
              - light.slaapkamer_lamp_3
              - light.slaapkamer_lamp_4
              - light.slaapkamer_lamp_5
            data:
              brightness_pct: 100
              color_temp_kelvin: 2700
        - conditions:
          - condition: template
            value_template: '{{ spots_aan }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.slaapkamer_strip
            data:
              brightness_pct: 30
              color_temp_kelvin: 2700
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.slaapkamer_lamp_1
            - light.slaapkamer_lamp_2
            - light.slaapkamer_lamp_3
            - light.slaapkamer_lamp_4
            - light.slaapkamer_lamp_5
          data:
            brightness_pct: 100
            color_temp_kelvin: 2700
        - action: light.turn_on
          target:
            entity_id: light.slaapkamer_strip
          data:
            brightness_pct: 30
            color_temp_kelvin: 2700
    - conditions:
      - condition: trigger
        id:
        - omhoog_lang
      sequence:
      - condition: template
        value_template: '{{ aan | count > 0 }}'
      - repeat:
          count: 12
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ aan }}'
            data:
              brightness_step_pct: 10
              transition: 0.3
          - delay:
              milliseconds: 300
    - conditions:
      - condition: trigger
        id:
        - omlaag_lang
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.slaapkamer_lamp_1
          - light.slaapkamer_lamp_2
          - light.slaapkamer_lamp_3
          - light.slaapkamer_lamp_4
          - light.slaapkamer_lamp_5
      - action: light.turn_on
        target:
          entity_id: light.slaapkamer_strip
        data:
          brightness_pct: 20
    - conditions:
      - condition: trigger
        id:
        - links
        - rechts
      sequence:
      - condition: template
        value_template: '{{ aan | count > 0 }}'
      - action: light.turn_on
        target:
          entity_id: '{{ aan }}'
        data:
          color_temp_kelvin: '{% set k = aan | map(''state_attr'',''color_temp_kelvin'')
            | select(''number'') | list %}{% set nu = (k | sum / k | count) if k else
            3000 %}{{ ([[nu + (-400 if trigger.id == ''links'' else 400), 2200] |
            max, 4000] | min) | int }}'
    - conditions:
      - condition: trigger
        id:
        - links_lang
      sequence:
      - condition: template
        value_template: '{{ aan | count > 0 }}'
      - action: light.turn_on
        target:
          entity_id: '{{ aan }}'
        data:
          color_temp_kelvin: 2200
    - conditions:
      - condition: trigger
        id:
        - rechts_lang
      sequence:
      - condition: template
        value_template: '{{ aan | count > 0 }}'
      - action: light.turn_on
        target:
          entity_id: '{{ aan }}'
        data:
          color_temp_kelvin: 4000
  mode: restart

- id: '1603830622083'
  alias: Gang lamp
  description: Zet ganglamp aan op basis van beweging/aanwezigheid, alleen als het
    donker is. Helderheid en kleur op basis van tijdstip.
  triggers:
  - type: occupied
    device_id: e13fa775ae5c1aa7dc0dd04f3d6fe2e8
    entity_id: 48f91ab28a35ff8c56779561f10c1d33
    domain: binary_sensor
    trigger: device
  - type: motion
    device_id: f0557193b49cd30a72b37ed875ced7b6
    entity_id: ee892634746b2f5638cbfadb0a0aca3c
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: state
    entity_id: binary_sensor.gang_bewegingsmelder_licht
    state:
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 05:00:00
        before: 09:00:00
      sequence:
      - action: light.turn_on
        target:
          area_id: gang
        data:
          brightness_pct: 30
          color_temp_kelvin: 2200
    - conditions:
      - condition: time
        after: 09:00:00
        before: '17:00:00'
      sequence:
      - action: light.turn_on
        target:
          area_id: gang
        data:
          brightness_pct: 51
          color_temp_kelvin: 3390
    - conditions:
      - condition: time
        after: '17:00:00'
        before: '22:00:00'
      sequence:
      - action: light.turn_on
        target:
          area_id: gang
        data:
          brightness_pct: 80
          color_temp_kelvin: 2200
    default:
    - action: light.turn_on
      target:
        area_id: gang
      data:
        brightness_pct: 1
        color_temp_kelvin: 2000
  - wait_for_trigger:
    - trigger: template
      value_template: '{{ (states(''binary_sensor.gang_bewegingsmelder_beweging'')
        == ''off'') and (states(''binary_sensor.overloop_bewegingsmelder'') == ''off'')
        }}'
      for: 00:01:00
    timeout: 00:05:00
    continue_on_timeout: true
  - action: light.turn_off
    target:
      area_id: gang
  mode: restart
- id: '1612988672846'

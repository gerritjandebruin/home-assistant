  - entity_id:
    - binary_sensor.badkamer_deur_openen
    to:
    - 'on'
    trigger: state
  - entity_id: binary_sensor.badkamer_bewegingsmelder_bezetting
    to: 'on'
    trigger: state
  conditions:

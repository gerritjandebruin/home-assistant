  conditions:
  - condition: state
    entity_id: binary_sensor.badkamer_bewegingsmelder_bezetting
    state: 'off'
    for: 00:15:00
  - condition: state
    entity_id: input_select.badkamer_lichtstand
    state: normaal
  actions:
  - action: light.turn_off
    target:
      entity_id: light.badkamer
  mode: single
- id: swv_lek_dicht
  alias: Wasmachine - watertoevoer dicht bij lek
  description: Sluit de Sonoff SWV-ZFE zodra de BADRING-lekbaksensor water ziet. De
    klep is een sleepy Zigbee-device, dus het dichtstuurcommando wordt herhaald tot
    de state daadwerkelijk omslaat.
  triggers:
  - trigger: state
    entity_id: binary_sensor.wasmachine_bak
    to: 'on'
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: Lek bij de wasmachine
      message: Water in de lekbak op zolder. Toevoer wordt dichtgestuurd.
      notification_id: swv_lek_bij_de_wasmachin
  - action: notify.mobile_app_fairphone_6
    data:
      title: Lek bij de wasmachine
      message: Water in de lekbak op zolder. Toevoer wordt dichtgestuurd.
      data:
        ttl: 0
        priority: high
        channel: Waterlek
    continue_on_error: true
  - action: notify.mobile_app_fairphone_6_gj
    data:
      title: Lek bij de wasmachine
      message: Water in de lekbak op zolder. Toevoer wordt dichtgestuurd.
      data:
        ttl: 0
        priority: high
        channel: Waterlek
    continue_on_error: true
  - action: switch.turn_off
    target:
      entity_id: switch.wasmachine
    continue_on_error: true
  - repeat:
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.wasmachine_watertoevoer
      - delay:
          seconds: 20
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.wasmachine_watertoevoer
          state: 'off'
        - condition: template
          value_template: '{{ repeat.index >= 30 }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.wasmachine_watertoevoer
        state: 'on'
      sequence:
      - action: persistent_notification.create
        data:
          title: Klep gaat NIET dicht
          message: De wasmachineklep reageert niet op het dichtstuurcommando. Handmatig
            afsluiten.
          notification_id: swv_klep_gaat_niet_dicht
      - action: notify.mobile_app_fairphone_6
        data:
          title: Klep gaat NIET dicht
          message: De wasmachineklep reageert niet op het dichtstuurcommando. Handmatig
            afsluiten.
          data:
            ttl: 0
            priority: high
            channel: Waterlek
        continue_on_error: true
      - action: notify.mobile_app_fairphone_6_gj
        data:
          title: Klep gaat NIET dicht
          message: De wasmachineklep reageert niet op het dichtstuurcommando. Handmatig
            afsluiten.
          data:
            ttl: 0
            priority: high
            channel: Waterlek
        continue_on_error: true
  mode: single
  max_exceeded: silent
- id: swv_te_lang_open
  alias: Wasmachine - klep te lang open
  description: 'Vangnet: de klep hoort alleen open te staan tijdens een wasbeurt.
    De langste programma''s duren ~5 uur, dus na 6 uur is open een vergissing.'
  triggers:
  - trigger: state
    entity_id: switch.wasmachine_watertoevoer
    to: 'on'
    for:
      hours: 6
  conditions: []
  actions:
  - repeat:
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.wasmachine_watertoevoer
      - delay:
          seconds: 20
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.wasmachine_watertoevoer
          state: 'off'
        - condition: template
          value_template: '{{ repeat.index >= 30 }}'
  - action: persistent_notification.create
    data:
      title: Wasmachineklep stond te lang open
      message: Stond 6 uur open en is automatisch dichtgestuurd.
      notification_id: swv_wasmachineklep_stond
  - action: notify.mobile_app_fairphone_6_gj
    continue_on_error: true
    data:
      title: Wasmachineklep stond te lang open
      message: Stond 6 uur open en is automatisch dichtgestuurd.
      data:
        group: wasmachineklep
  mode: single
- id: swv_batterij_laag
  alias: Wasmachine - klep batterij laag
  description: Bij lege batterijen blijft de klep in zijn laatste stand staan. Op
    tijd vervangen dus (4x AA).
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wasmachine_watertoevoer_batterij
    below: 25
    for:
      hours: 1
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: Batterij wasmachineklep laag
      message: De Sonoff SWV-ZFE zit onder de 25%. Vervang de 4x AA.
      notification_id: swv_batterij_wasmachinek
  - action: notify.mobile_app_fairphone_6_gj
    continue_on_error: true
    data:
      title: Batterij wasmachineklep laag
      message: De Sonoff SWV-ZFE zit onder de 25%. Vervang de 4x AA.
      data:
        group: batterij
  mode: single
- id: frank_kwartierprijzen_1_november
  alias: 'Frank Energie: naar kwartierprijzen per 1 november'
  description: 'Eenmalig: het Frank-contract gaat op 1-11-2026 van uur- naar kwartierprijzen.
    Zet de prijsresolutie van de integratie (zonder login) mee, zodat het Energie-dashboard
    met dezelfde prijzen rekent als de factuur. Schakelt zichzelf daarna uit.'
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: template
    value_template: '{{ now().date() | string == ''2026-11-01'' }}'
  actions:
  - data:
      option: pt15m
    target:
      entity_id: select.frank_energie_instellingen_prijs_resolutie
    action: select.select_option
  - target:
      entity_id: '{{ this.entity_id }}'
    action: automation.turn_off
  mode: single
- id: bureau_gj_uit_bij_sluipverbruik
  alias: Bureau GJ uit bij sluipverbruik
  description: Zet de stekker van bureau GJ uit als het bureau 30 minuten alleen standby
    verbruikt (onder 10 W; standby is ~6 W, in gebruik 15 W of meer). Tweede trigger
    vangt het geval af dat de stekker wordt aangezet maar het bureau niet gebruikt
    wordt. Weer aan met de bureauknop (automation Bureau GJ). Bespaart ~50 kWh per
    jaar.
  triggers:
  - for:
      minutes: 30
    below: 10
    entity_id: sensor.zolder_bureau_gj_vermogen
    trigger: numeric_state
  - for:
      minutes: 30
    to: 'on'
    entity_id: switch.zolder_bureau_gj
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.zolder_bureau_gj
    state: 'on'
  - below: 10
    condition: numeric_state
    entity_id: sensor.zolder_bureau_gj_vermogen
  actions:
  - target:
      entity_id: switch.zolder_bureau_gj
    action: switch.turn_off
  mode: single
- id: woonkamer_strip_gang_beweging
  alias: Woonkamer strip - aan bij beweging in gang
  description: Zet de woonkamerstrip aan bij beweging in de gang beneden als het donker
    is, en weer uit als er 5 min geen beweging in de gang en niemand in de woonkamer
    is. Drukt iemand tijdens die tijd op knop 1 van de Hue dimmer, dan blijft de strip
    aan (uit gaat dan met de dimmer of na 12 uur). Staat de strip al aan, dan doet
    deze automation niets.
  triggers:
  - trigger: state
    entity_id: binary_sensor.gang_bewegingsmelder_beweging
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.gang_bewegingsmelder_licht
    state: 'off'
  - condition: state
    entity_id: light.woonkamer_strip
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.woonkamer_strip
    data:
      brightness_pct: 100
  - wait_for_trigger:
    - trigger: template
      id: geen_beweging
      value_template: '{{ is_state(''binary_sensor.gang_bewegingsmelder_beweging'',''off'')
        and is_state(''binary_sensor.woonkamer_aanwezigheid'',''off'') }}'
      for: 00:05:00
    - trigger: state
      id: knop
      entity_id: event.hue_dimmer_switch_1_knop_1
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger is not none and wait.trigger.id == ''geen_beweging''
      }}'
  - action: light.turn_off
    target:
      entity_id: light.woonkamer_strip
  mode: restart
- id: woonkamer_strip_uit_na_12_uur
  alias: Woonkamer strip - uit na 12 uur
  description: 'Vangnet: de woonkamerstrip gaat vanzelf uit als hij 12 uur aan staat,
    hoe hij ook is aangezet.'
  triggers:
  - trigger: state
    entity_id: light.woonkamer_strip
    to: 'on'
    for: '12:00:00'
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.woonkamer_strip
  mode: single
- id: woonkamer_strip_aanwezigheid
  alias: Woonkamer strip - aan bij aanwezigheid in het donker
  description: Zet de woonkamerstrip aan als er iemand in de woonkamer is en het er
    donker is, en weer uit als niemand meer aanwezig is. Ook als het donker wordt
    terwijl er iemand zit. Drukt iemand tussendoor op knop 1 van de Hue dimmer, dan
    blijft de strip aan (uit gaat dan met de dimmer of na 12 uur). Staat de strip
    al aan, dan doet deze automation niets.
  triggers:
  - trigger: state
    entity_id: binary_sensor.woonkamer_aanwezigheid
    from: 'off'
    to: 'on'
  - trigger: numeric_state
    entity_id: sensor.woonkamer_aanwezigheid_licht
    below: 30
    for: 00:02:00
  conditions:
  - condition: state
    entity_id: binary_sensor.woonkamer_aanwezigheid
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.woonkamer_aanwezigheid_licht
    below: 30
  - condition: state
    entity_id: light.woonkamer_strip
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.woonkamer_strip
    data:
      brightness_pct: 100
  - wait_for_trigger:
    - trigger: state
      id: weg
      entity_id: binary_sensor.woonkamer_aanwezigheid
      from: 'on'
      to: 'off'
    - trigger: state
      id: knop
      entity_id: event.hue_dimmer_switch_1_knop_1
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger is not none and wait.trigger.id == ''weg'' }}'
  - action: light.turn_off
    target:
      entity_id: light.woonkamer_strip
  mode: restart
- id: badkamer_knop_lichtstanden
  alias: Badkamer knop - lichtstanden
  description: 'BILRESA in de badkamer. Knop 1: spots uit, alleen de strip warm gedimd.
    Knop 2: alles heel zacht in warm roodoranje. Nog eens op dezelfde knop: terug
    naar de scene Badkamer sparkle. De spiegellamp kan niet dimmen en gaat in beide
    standen uit.'
  triggers:
  - trigger: state
    entity_id: event.badkamer_knop_knop_1
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
    id: led
  - trigger: state
    entity_id: event.badkamer_knop_knop_2
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
    id: romantisch
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_1''
      }}'
  actions:
  - variables:
      nieuw: '{{ ''normaal'' if states(''input_select.badkamer_lichtstand'') == trigger.id
        else trigger.id }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.badkamer_lichtstand
    data:
      option: '{{ nieuw }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ nieuw == ''led'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.badkamer_spots
          - light.badkamer_spiegellamp
      - action: light.turn_on
        target:
          entity_id: light.badkamer_strip
        data:
          effect: 'off'
      - action: light.turn_on
        target:
          entity_id: light.badkamer_strip
        data:
          brightness_pct: 40
          color_temp_kelvin: 2200
    - conditions:
      - condition: template
        value_template: '{{ nieuw == ''romantisch'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.badkamer_spiegellamp
      - action: light.turn_on
        target:
          entity_id: light.badkamer_spots
        data:
          brightness_pct: 1
          hs_color:
          - 10
          - 90
      - action: light.turn_on
        target:
          entity_id: light.badkamer_strip
        data:
          effect: 'off'
      - action: light.turn_on
        target:
          entity_id: light.badkamer_strip
        data:
          brightness_pct: 8
          hs_color:
          - 10
          - 90
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.badkamer_sparkle
  mode: restart
- id: badkamer_lichtstand_einde
  alias: Badkamer lichtstand - einde
  description: 'Sfeerstand staat maximaal 2 uur aan, en vervalt als alle badkamerverlichting
    uit is of HA herstart. Terug op normaal gelden weer de gewone uit-regels: uit
    na 20 min geen beweging (max 45 min), omdat de automation Badkamer verlichting
    dan niet meer loopt.'
  triggers:
  - trigger: state
    entity_id: input_select.badkamer_lichtstand
    to:
    - led
    - romantisch
    for: 02:00:00
    id: maximum
  - trigger: state
    entity_id: light.badkamer_alle_verlichting
    to: 'off'
    for: 00:00:10
    id: uit
  - trigger: homeassistant
    event: start
    id: uit
  - trigger: state
    entity_id: input_select.badkamer_lichtstand
    from:
    - led
    - romantisch
    to: normaal
    id: terug
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: maximum
      sequence:
      - action: light.turn_off
        target:
          area_id: badkamer
      - delay: 00:00:02
      - action: input_select.select_option
        target:
          entity_id: input_select.badkamer_lichtstand
        data:
          option: normaal
    - conditions:
      - condition: trigger
        id: uit
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.badkamer_lichtstand
          state: normaal
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.badkamer_lichtstand
        data:
          option: normaal
    - conditions:
      - condition: trigger
        id: terug
      - condition: state
        entity_id: light.badkamer_alle_verlichting
        state: 'on'
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.badkamer_bewegingsmelder_bezetting
          to: 'off'
          for:
            minutes: 20
        timeout: 00:45:00
        continue_on_timeout: true
      - action: light.turn_off
        target:
          area_id: badkamer
  mode: restart
- id: airco_onbereikbaar
  alias: Airco - onbereikbaar
  description: De airco heeft eerder de aardlekschakelaar laten afslaan, waardoor
    ook de omvormer uitviel. Onbereikbaar kan ook gewoon wifi zijn; daarom noemt de
    melding of de omvormer tegelijk weg is.
  triggers:
  - trigger: state
    entity_id: climate.airconditioner
    to: unavailable
    for: 00:30:00
  conditions: []
  actions:
  - action: notify.mobile_app_fairphone_6_gj
    data:
      title: ⚠️ Airco onbereikbaar
      message: '{% if is_state(''sensor.zonnepanelen_output_power'', ''unavailable'')
        %}De airco en de omvormer zijn allebei weg. Controleer de aardlekschakelaar.{%
        else %}De airco is al 30 minuten onbereikbaar. De omvormer doet het nog, dus
        waarschijnlijk is het de wifi of de groep van de airco.{% endif %}'
      data:
        group: airco
  mode: single
- id: airco_vergeten_uit
  alias: Airco - vergeten uit
  description: 'Melding als de airco aan staat terwijl we allebei minstens een uur
    weg zijn, of als hij 12 uur aan staat. Die tweede regel is er omdat de aanwezigheid
    op twee telefoons leunt en dus kan falen. Twee aanroepen van de legacy diensten
    (notify.send_message geeft geen group door): mobile_app_fairphone_6_gj is Gerrit-Jan,
    mobile_app_fairphone_6 is Mirjam (Telefoon Mirjam).'
  triggers:
  - trigger: state
    entity_id: person.gerrit_jan
    from: home
    for: 01:00:00
    id: weg
  - trigger: state
    entity_id: person.mirjam
    from: home
    for: 01:00:00
    id: weg
  - trigger: state
    entity_id: climate.airconditioner
    from: 'off'
    for: 01:00:00
    id: weg
  - trigger: state
    entity_id: climate.airconditioner
    to:
    - auto
    - cool
    - dry
    - heat
    - fan_only
    for: '12:00:00'
    id: lang
  conditions:
  - condition: state
    entity_id: climate.airconditioner
    state:
    - auto
    - cool
    - dry
    - heat
    - fan_only
  - condition: or
    conditions:
    - condition: trigger
      id: lang
    - condition: template
      value_template: '{{ not is_state(''person.gerrit_jan'', ''home'') and not is_state(''person.mirjam'',
        ''home'') and [states.person.gerrit_jan.last_changed, states.person.mirjam.last_changed]
        | max < now() - timedelta(hours=1) }}'
  actions:
  - action: notify.mobile_app_fairphone_6_gj
    continue_on_error: true
    data:
      title: Airco staat nog aan
      message: '{% if trigger.id == ''lang'' %}De airco staat al 12 uur aan.{% else
        %}De airco staat aan en er is al een uur niemand thuis.{% endif %}'
      data:
        group: airco
  - action: notify.mobile_app_fairphone_6
    continue_on_error: true
    data:
      title: Airco staat nog aan
      message: '{% if trigger.id == ''lang'' %}De airco staat al 12 uur aan.{% else
        %}De airco staat aan en er is al een uur niemand thuis.{% endif %}'
      data:
        group: airco
  mode: single

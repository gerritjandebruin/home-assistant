substitutions:
  name: energiemeter
packages:
  zuidwijk.slimmelezer: github://zuidwijk/dsmr/slimmelezer.yaml@main
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: Energiemeter
api:
  encryption:
    key: !secret slimmelezer_api_key
wifi:
  networks:
    - ssid: !secret wifi_ssid_iot2
      password: !secret wifi_password_iot2
    - ssid: !secret wifi_ssid_iot
      password: !secret wifi_password_iot
    - ssid: !secret wifi_ssid_main
      password: !secret wifi_password_main
    - ssid: !secret wifi_ssid_main2
      password: !secret wifi_password_main2
  reboot_timeout: 0s
  ap:
    ssid: "{name}"
    password: !secret ota_password

substitutions:
  name: slimmelezer
packages:
  zuidwijk.slimmelezer: github://zuidwijk/dsmr/slimmelezer.yaml@main
esphome:
  name: ${name}
  name_add_mac_suffix: false
api:
  encryption:
    key: !secret slimmelezer_api_key
wifi:
    networks:
      - ssid: !secret wifi_ssid
        password: !secret wifi_password

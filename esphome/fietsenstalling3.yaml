esphome:
  name: fietsenstalling3
  friendly_name: fietsenstalling3

esp32:
  variant: ESP32
  framework:
    type: esp-idf
logger:

api:
  encryption:
    key: !secret fietsenstalling_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: fietsenstalling Fallback Hotspot
    password: !secret fietsenstalling_password

captive_portal:

# ==========================================
# 1. VERLICHTING (RELAIS) - GPIO19
# ==========================================
switch:
  - platform: gpio
    name: "Verlichting"
    pin: GPIO19
    id: switch_gpio_1
    icon: "mdi:led-strip-variant"
    device_class: switch

# ==========================================
# 2. SENSOREN (DHT22 & MQ-6) - GPIO18 & GPIO32
# ==========================================
sensor:
  # DHT11 Temperatuur & Luchtvochtigheid
  - platform: dht
    pin: GPIO22
    model: DHT11
    temperature:
      name: "Temperatuur"
      id: sensor_dht_1_temperature
    humidity:
      name: "Luchtvochtigheid"
      id: sensor_dht_1_humidity
    id: sensor_dht_1
    update_interval: 10s

  # MQ-6 Gassensor (LPG/Propaan via jouw exacte configuratie)
  - platform: adc
    pin: GPIO32
    name: "LPG Propaan Concentratie"
    id: mq6_gas_sensor
    update_interval: 10s
    attenuation: 12db
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 3.0 -> 100.0
    unit_of_measurement: "%"
    icon: "mdi:gas-cylinder"

# ==========================================
# 3. LICHTKNOP (DRUKKNOP) - GPIO4
# ==========================================
binary_sensor:
  - platform: gpio
    name: "Lichtknop"
    id: binary_sensor_gpio_1
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    
    # Automatisering: Schakel de lamp om (Toggle) bij indrukken
    on_press:
      - then:
          - switch.toggle: switch_gpio_1

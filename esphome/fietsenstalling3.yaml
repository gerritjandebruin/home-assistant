esphome:
  name: fietsenstalling3
  friendly_name: fietsenstalling3

esp32:
  variant: ESP32
  framework:
    type: esp-idf
logger:

api:
  encryption:
    key: !secret fietsenstalling_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: fietsenstalling Fallback Hotspot
    password: !secret fietsenstalling_password

captive_portal:

# ==========================================
# 1. SWITCH
# ==========================================
switch:
  # Relais
  - platform: gpio
    name: "Relais"
    pin: GPIO19
    id: relais
    icon: "mdi:led-strip-variant"
    device_class: switch
# ==========================================
# 2. SENSOREN
# ==========================================
sensor:
  # DHT11 Temperatuur & Luchtvochtigheid
  - platform: dht
    pin: GPIO22
    model: DHT11
    temperature:
      name: "Temperatuur"
      id: temperature
    humidity:
      name: "Luchtvochtigheid"
    update_interval: 10s
  # MQ-6 Gassensor
  - platform: adc
    pin: GPIO32
    name: "LPG Propaan Concentratie"
    id: gas
    update_interval: 10s
    attenuation: 12db
    filters:
      - calibrate_linear:
          - 0.1419 -> 0.0
          - 3.0 -> 100.0
    unit_of_measurement: "%"
    icon: "mdi:gas-cylinder"
  # WiFi signal
  - platform: wifi_signal
    name: "WiFi Signaal"
  # Uptime
  - platform: uptime
    name: "Uptime"
# ==========================================
# 3. BINARAIRE SENSOREN
# ==========================================
binary_sensor:
  # Lichtknop
  - platform: gpio
    name: "Lichtknop"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - then:
          - switch.toggle: relais
  # Beweging
  - platform: gpio
    name: "Beweging"
    id: pir_sensor
    pin:
      number: GPIO13
      mode: INPUT  # De PIR heeft zelf al een actieve output, PULLUP is niet nodig
    device_class: motion
  # Lichtsensor
  - platform: gpio
    name: "Lichtsensor"
    pin: GPIO25
    device_class: light
# ==========================================
# 4. DISPLAY
# ==========================================
display:
    platform: tm1637
    id: my_display_logic
    clk_pin: GPIO14
    dio_pin: GPIO27
    inverted: true
    update_interval: 2s
    length: 4
    lambda: |-
      float temperature_value = id(temperature).state;
      float gas_value = id(gas).state;
      
      // Gebruik de interne tijd (in seconden) om te wisselen
      int mode = (id(my_display_logic).get_update_interval() / 1000) % 2;
      
      // Snelheid/wissel-logica op basis van millis
      uint32_t t = millis() / 4000; 

      if (t % 2 == 0) {
        // Mode 1: Toon Temperatuur (bijv: 19.5)
        if (!isnan(temperature_value)) {
          it.printf("%.1f", temperature_value);
        }
      } else {
        // Mode 2: Toon Gaspercentage (bijv:   5%)
        if (!isnan(gas_value)) {
          it.printf("%3.0f%%", gas_value); // Het %-teken zet een 'C' of speciaal teken afhankelijk van het display, vaak laat %3.0f netjes het getal rechts uitgelijnd zien
        }
      }
# ==========================================
# 5. Button
# ==========================================
button:
  - platform: restart
    name: "Herstarten"
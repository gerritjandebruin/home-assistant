esphome:
  name: fietsenstalling3
  friendly_name: fietsenstalling3

esp32:
  variant: ESP32
  framework:
    type: esp-idf
logger:

api:
  encryption:
    key: !secret fietsenstalling_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: fietsenstalling Fallback Hotspot
    password: !secret fietsenstalling_password

captive_portal:

# ==========================================
# 1. SWITCH
# ==========================================
switch:
  # Relais
  - platform: gpio
    name: "Relais"
    pin: GPIO19
    id: relais
    icon: "mdi:led-strip-variant"
    device_class: switch

# ==========================================
# 2. SENSOREN
# ==========================================
sensor:
  # DHT11 Temperatuur & Luchtvochtigheid
  - platform: dht
    pin: GPIO22
    model: DHT11
    temperature:
      name: "Temperatuur"
    humidity:
      name: "Luchtvochtigheid"
    update_interval: 10s

  # MQ-6 Gassensor
  - platform: adc
    pin: GPIO32
    name: "LPG Propaan Concentratie"
    update_interval: 10s
    attenuation: 12db
    filters:
      - calibrate_linear:
          - 0.1419 -> 0.0
          - 3.0 -> 100.0
    unit_of_measurement: "%"
    icon: "mdi:gas-cylinder"

# ==========================================
# 3. BINARAIRE SENSOREN
# ==========================================
binary_sensor:
  # Lichtknop
  - platform: gpio
    name: "Lichtknop"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - then:
          - switch.toggle: relais
  # Beweging
  - platform: gpio
    name: "Beweging"
    id: pir_sensor
    pin:
      number: GPIO13
      mode: INPUT  # De PIR heeft zelf al een actieve output, PULLUP is niet nodig
    device_class: motion
  - platform: gpio
    name: "Lichtsensor"
    pin: GPIO25
    device_class: light

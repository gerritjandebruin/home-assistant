# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: fietsenstalling
  friendly_name: fietsenstalling

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret fietsenstalling_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: fietsenstalling Fallback Hotspot
    password: !secret fietsenstalling_password

captive_portal:

switch:
  - platform: gpio
    name: verlichting
    pin: GPIO19
    id: switch_gpio_1
    icon: "mdi:led-strip-variant"
    device_class: switch

sensor:
  - platform: dht
    pin: GPIO18
    humidity:
      id: sensor_dht_1_humidity
      name: Humidity
    temperature:
      id: sensor_dht_1_temperature
      name: Temperature
    id: sensor_dht_1

binary_sensor:
  - platform: gpio
    name: Lichtknop
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    id: binary_sensor_gpio_1

# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: fietsenstalling
  friendly_name: fietsenstalling

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret fietsenstalling_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: fietsenstalling Fallback Hotspot
    password: !secret fietsenstalling_password

captive_portal:

sensor:
- platform: adc
  pin: GPIO32
  name: "LPG Propaan Concentratie"
  id: mq6_gas_sensor
  update_interval: 10s
  attenuation: 12db
  filters:
    - calibrate_linear:
        - 0.0 -> 0.0
        - 3.0 -> 100.0 # Aangepast naar 3.0V voor jouw specifieke weerstanden
  unit_of_measurement: "%"
  icon: "mdi:gas-cylinder"

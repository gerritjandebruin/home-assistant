substitutions:
  name: woonkamer-luchtkwaliteit
  friendly_name: Woonkamer luchtkwaliteit
packages:
  ApolloAutomation.AIR-1: github://ApolloAutomation/AIR-1/Integrations/ESPHome/AIR-1_BLE.yaml@25.8.6.1
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret api_encryption_key
wifi:
  networks:
    - ssid: !secret wifi_ssid_iot2
      password: !secret wifi_password_iot2
    - ssid: !secret wifi_ssid_iot
      password: !secret wifi_password_iot
    - ssid: !secret wifi_ssid_main
      password: !secret wifi_password_main
    - ssid: !secret wifi_ssid_main2
      password: !secret wifi_password_main2
  reboot_timeout: 0s
  manual_ip: 
    static_ip: 192.168.1.6
    subnet: 255.255.255.0
    gateway: 192.168.1.1
logger:
  baud_rate: 0
text_sensor:
  - platform: template
    name: "Firmware version"
    id: "firmware_version"
    icon: "mdi:git"
    entity_category: "diagnostic"
    update_interval: never
    lambda: |-
      return {"25.8.6.1"}; // Manually update this to match what you set above
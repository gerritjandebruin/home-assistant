esphome:
  name: tno-esp-32-l15
  friendly_name: tno-esp-32-l15

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret tno_esp_32_l13_api_key

ota:
  - platform: esphome
    password: !secret tno_esp_32_l13_password

wifi:
  ssid: EMSA_Veldwerk
  password: !secret tno_esp_32_l13_password_2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "EMSA_Veldwerk (ESP32)"
    password: !secret tno_esp_32_l13_password_2

captive_portal:

# I2C Bus on Grove Port (HY2.0-4P)
i2c:
  sda: GPIO26
  scl: GPIO32 
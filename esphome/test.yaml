# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: test
  friendly_name: test

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret test_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: test Fallback Hotspot
    password: !secret test_password

captive_portal:

sensor:
  - platform: dht
    pin: GPIO25
    humidity:
      id: sensor_dht_1_humidity
      name: Humidity
    temperature:
      id: sensor_dht_1_temperature
      name: Temperature
    id: sensor_dht_1
    update_interval: 1s

substitutions:
  name: watermeter
  friendly_name: watermeter
packages:
  esphome.muino-water-meter: github://martijnvwezel/watermeter-esphome/muino-water-meter-esp32.yaml@V4.1.2
esphome:
  name: ${name}
  name_add_mac_suffix: false
api:
  encryption:
    key: !secret api_encryption_key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.1.5
    gateway: 192.168.1.1
    subnet: 255.255.255.0
web_server:
  port: 80
sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi-signaal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome Versie
    hide_timestamp: true
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    ssid:
      name: Wi-Fi SSID
      entity_category: diagnostic
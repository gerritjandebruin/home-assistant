substitutions:
  name: watermeter
  friendly_name: watermeter
packages:
  esphome.muino-water-meter: github://martijnvwezel/watermeter-esphome/muino-water-meter-esp32.yaml@V4.1.2
esphome:
  name: ${name}
  name_add_mac_suffix: false
api:
  encryption:
    key: !secret api_encryption_key_watermeter
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip: 
    static_ip: 192.168.1.5
    gateway: 192.168.1.1
    subnet: 255.255.255.0
web_server:
  port: 80

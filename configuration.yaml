default_config:

recorder:
  purge_keep_days: 60
  exclude:
    entities:
      - sensor.zonnepanelen_output_power

zha:
  custom_quirks_path: /config/zha_quirks/
  zigpy_config:
    device_options:
      consider_unavailable_time_battery: 86400 # seconden; 24 uur
      consider_unavailable_time_mains: 21600 # seconden; 6 uur

homeassistant:
  packages: !include_dir_named packages/
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 192.168.1.0/24
        - 127.0.0.1
        - 95.99.85.207
  customize:
    sensor.vacuum_cleaning_area:
      unit_of_measurement: "m³"
    sensor.vacuum_cleaning_time:
      unit_of_measurement: "min"

automation: !include automations.yaml
scene: !include scenes.yaml